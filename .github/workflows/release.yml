name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish (self-contained win-x64)
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          .\publish.ps1 `
            -Version $version `
            -AnxoRoot "${{ vars.ANXO_ROOT || 'C:\repositorios\pilot\ANXO LIBRARIES' }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: GymService-win-x64
          path: artifacts\GymService-*-win-x64.zip
          if-no-files-found: error
