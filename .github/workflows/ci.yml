name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # Runner self-hosted de Windows con las ANXO Libraries disponibles.
    # Configura la variable de repositorio ANXO_ROOT con la ruta a
    # "...\ANXO LIBRARIES" (por defecto C:\repositorios\pilot\ANXO LIBRARIES).
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: |
          dotnet build GymService.slnx -c Release -p:AnxoRoot="${{ vars.ANXO_ROOT || 'C:\repositorios\pilot\ANXO LIBRARIES' }}"

      - name: Tests (unitarias)
        shell: pwsh
        run: |
          dotnet test GymService.Tests\GymService.Tests.csproj -c Release --no-build

      - name: Tests (integración)
        if: ${{ vars.RUN_INTEGRATION_TESTS == 'true' }}
        shell: pwsh
        env:
          GYM_TEST_DB_SERVER: ${{ vars.GYM_TEST_DB_SERVER }}
          GYM_TEST_DB_USER: ${{ vars.GYM_TEST_DB_USER }}
          GYM_TEST_DB_PASSWORD: ${{ secrets.GYM_TEST_DB_PASSWORD }}
        run: |
          dotnet test GymService.Tests\GymService.Tests.csproj -c Release --no-build
